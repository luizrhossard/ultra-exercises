server:
  port: 8085

spring:
  application:
    name: forja-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:forja}
    username: ${DB_USER:forja}
    password: ${DB_PASS:forja}

  jpa:
    hibernate:
      ddl-auto: validate          # o schema é dono do Flyway; Hibernate só confere
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

forja:
  jwt:
    # troque por um segredo real (32+ caracteres) via variável de ambiente
    secret: ${JWT_SECRET:forja-dev-secret-troque-em-producao-0123456789abcdef}
    ttl-minutes: 720
  cors:
    origins: http://localhost:5173,http://localhost:3000
  security:
    # HSTS apenas em produção atrás de HTTPS (ver docs/security/http-security-headers.md)
    hsts-enabled: false
  rate-limit:
    enabled: true
    login:        { limit: 5,   window-seconds: 900 }   # 5/IP a cada 15 min
    register:     { limit: 5,   window-seconds: 3600 }  # 5/IP por hora
    public-read:  { limit: 30,  window-seconds: 60 }    # 30/IP por minuto
    authenticated: { limit: 100, window-seconds: 60 }   # 100/usuário por minuto
    two-factor:   { limit: 5,   window-seconds: 600 }   # desafio 2FA: 5/IP a cada 10 min [UE-24]
    max-payload-bytes: 1048576                          # 1 MiB

logging:
  level:
    com.forja: INFO
    org.hibernate.SQL: WARN
