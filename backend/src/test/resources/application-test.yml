spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/forja_test
    username: forja
    password: forja
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

forja:
  jwt:
    secret: test-secret-com-pelo-menos-32-caracteres-1234567890
    ttl-minutes: 720
  cors:
    origins: http://localhost:5173
  rate-limit:
    # Limites altos no perfil de teste para não contaminar testes entre si;
    # o comportamento do limitador é coberto por RateLimitFilterTest e pela
    # SecurityHeadersAndRateLimitIntegrationTest (que sobrepõe o limite de login).
    enabled: true
    login:        { limit: 1000, window-seconds: 60 }
    register:     { limit: 1000, window-seconds: 60 }
    public-read:  { limit: 1000, window-seconds: 60 }
    authenticated: { limit: 10000, window-seconds: 60 }

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html