services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forja
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja
    ports:
      - "5433:5432"
    volumes:
      - forja-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8085:8085"
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forja_test
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forja-pg:
