services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forja
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja
    ports:
      - "5433:5432"
    volumes:
      - forja-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forja-pg:
