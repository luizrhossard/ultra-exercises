server:
  port: 8085

spring:
  application:
    name: forja-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:forja}
    username: ${DB_USER:forja}
    password: ${DB_PASS:forja}

  jpa:
    hibernate:
      ddl-auto: validate          # o schema é dono do Flyway; Hibernate só confere
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

forja:
  jwt:
    # troque por um segredo real (32+ caracteres) via variável de ambiente
    secret: ${JWT_SECRET:forja-dev-secret-troque-em-producao-0123456789abcdef}
    ttl-minutes: 720
  cors:
    origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.forja: INFO
    org.hibernate.SQL: WARN
