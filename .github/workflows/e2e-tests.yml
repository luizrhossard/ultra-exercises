name: E2E Tests [UE-64]

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/e2e-tests.yml'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - 'src/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/e2e-tests.yml'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - 'src/**'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: all
        type: choice
        options: [all, chromium, firefox, webkit]
      tags:
        description: 'Test tags to run (e.g., @smoke, @regression)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

jobs:
  configure:
    name: Configure E2E
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      backend: ${{ steps.config.outputs.backend }}
    steps:
      - id: config
        env:
          BROWSER: ${{ inputs.browser || 'all' }}
          BACKEND_URL: ${{ secrets.E2E_BACKEND_URL }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const entries = [
            { name: 'chromium', project: 'chromium', browser: 'chromium', grep: '' },
            { name: 'firefox', project: 'firefox', browser: 'firefox', grep: '' },
            { name: 'webkit', project: 'webkit', browser: 'webkit', grep: '' },
            { name: 'mobile-chrome', project: 'Mobile Chrome', browser: 'chromium', grep: '' },
            { name: 'mobile-safari', project: 'Mobile Safari', browser: 'webkit', grep: '' },
            { name: 'smoke', project: 'chromium', browser: 'chromium', grep: '@smoke' },
          ];
          const selected = process.env.BROWSER === 'all' ? entries
            : entries.filter(entry => entry.name === process.env.BROWSER);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({ include: selected })}\nbackend=${Boolean(process.env.BACKEND_URL)}\n`);
          JS

  test:
    name: E2E · ${{ matrix.name }}
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      # O webServer do Playwright inicia e encerra o Vite na porta 3000.
      - name: Run Playwright tests
        env:
          PROJECT: ${{ matrix.project }}
          TAGS: ${{ inputs.tags || matrix.grep }}
        run: |
          args=(--project="$PROJECT")
          if [ -n "$TAGS" ]; then args+=(--grep="$TAGS"); fi
          npx playwright test "${args[@]}"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
            allure-results/
          retention-days: 7

  api-contracts:
    name: API Contract Tests
    needs: configure
    if: needs.configure.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BACKEND_URL: ${{ secrets.E2E_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/api-contracts.spec.ts --project=chromium
      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-contracts-report
          path: |
            playwright-report/
            test-results/
            allure-results/
          retention-days: 7

  summary:
    name: Test Summary
    needs: [configure, test, api-contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report actual job results
        env:
          CONFIG_RESULT: ${{ needs.configure.result }}
          E2E_RESULT: ${{ needs.test.result }}
          API_RESULT: ${{ needs.api-contracts.result }}
        run: |
          {
            echo '## E2E Test Results [UE-64]'
            echo '| Suite | Result |'
            echo '|---|---|'
            echo "| Configuration | $CONFIG_RESULT |"
            echo "| Browsers and smoke | $E2E_RESULT |"
            echo "| API contracts (requires E2E_BACKEND_URL) | $API_RESULT |"
            echo 'Reports, screenshots, videos and traces are available in the run artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CONFIG_RESULT" = success ] && [ "$E2E_RESULT" = success ] &&
            { [ "$API_RESULT" = success ] || [ "$API_RESULT" = skipped ]; }
