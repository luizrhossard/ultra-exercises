name: CI

# [UE-31] Pipeline de integração: roda em todo PR e nos pushes para develop/main.
# Gates: lint + typecheck + cobertura ≥80% (frontend), cobertura ≥80% via JaCoCo
# (backend), E2E dos fluxos críticos e build só após todos os testes passarem.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend · lint, tipos e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários com cobertura (gate ≥80% no vite.config.js)
        run: npm run test:coverage
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: E2E · fluxos críticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Testes E2E (APIs mockadas, sem backend)
        run: npx playwright test --project=chromium
      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  backend-tests:
    name: Backend · testes e cobertura JaCoCo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forja_test
          POSTGRES_USER: forja
          POSTGRES_PASSWORD: forja
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U forja"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes unitários + integração com gate JaCoCo ≥80%
        run: mvn -B -f backend/pom.xml verify
      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          retention-days: 14

  build:
    name: Build do frontend
    needs: [frontend-tests, e2e-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build de produção
        run: npm run build
      - name: Publicar artefato dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 30

  notify:
    name: Notificar Slack/Teams
    needs: [frontend-tests, e2e-tests, backend-tests, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Montar resumo
        id: resumo
        run: |
          status="✅ OK"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then status="❌ FALHOU"; fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then status="⚠️ CANCELADO"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Enviar para Slack
        if: always()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.resumo.outputs.status }}
          RUN_URL: ${{ steps.resumo.outputs.run_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SLACK_WEBHOOK_URL não configurado — pulando."; exit 0; fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI $STATUS · ${{ github.repository }} · ${{ github.ref_name }}\n$RUN_URL\"}" \
            "$WEBHOOK"
      - name: Enviar para Teams
        if: always()
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          STATUS: ${{ steps.resumo.outputs.status }}
          RUN_URL: ${{ steps.resumo.outputs.run_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "TEAMS_WEBHOOK_URL não configurado — pulando."; exit 0; fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CI $STATUS · ${{ github.repository }} · ${{ github.ref_name }}\n$RUN_URL\"}" \
            "$WEBHOOK"
